<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador Teachable Machine</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Clasificador de Imágenes</h1>

        <!-- Controles: Botones y umbral -->
        <div class="controles">
            <button id="btn-inicio">Inicio</button>
            <button id="btn-parada">Parada</button>
            
            <label for="umbral">Umbral mínimo coincidencia:</label>
            <input type="number" id="umbral" min="0" max="1" step="0.05" value="0.8">
        </div>

        <!-- Zona de la cámara -->
        <div class="camara-container">
            <div id="webcam-container"></div>
        </div>

        <!-- Subida de archivo manual -->
        <div class="subida-imagen">
            <label for="input-imagen">O sube una imagen:</label>
            <input type="file" id="input-imagen" accept="image/*">
            <div id="imagen-subida-container"></div>
        </div>

        <!-- Mensaje personalizado de salida -->
        <div id="mensaje-salida" class="mensaje">
            Esperando a iniciar el modelo...
        </div>

        <!-- Historial de resultados -->
        <div class="historial">
            <h2>Historial de Resultados</h2>
            <ul id="lista-historial"></ul>
        </div>
    </div>

    <!-- Scripts necesarios para Teachable Machine (los añadiremos más adelante) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <!-- Nuestro script de lógica -->
    <script src="app.js"></script>
</body>
</html>
